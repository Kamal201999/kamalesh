name: Deploy to KillerKoda

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG_DATA }}" > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        kubectl cluster-info

    - name: Apply Secrets
      run: |
        export KUBECONFIG=$PWD/kubeconfig
        kubectl apply -f my-secrets.yml

    - name: Apply PVC and Deployment
      run: |
        export KUBECONFIG=$PWD/kubeconfig
        kubectl apply -f my-pvc.yml
        kubectl apply -f deploy.yml
