apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-db-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: mysql
        image: mysql:latest
        env:
      - name: MYSQL_DATABASE
        valueFrom:
         configMapKeyRef:
          name: my-config
          key: MYSQL_USER
      -name: MYSQL_PASSWORD
        valueFrom:
          secretKeyRef:
           name: db-secret
           key: MYSQL_PASSWORD
        ports:
        - containerPort: 3306
      - name: nginx
        image: nginx
        ports: 
        - containerPort: 80
        env:
      - name: NGINX_PORT
        valueFrom:
         configMapKeyRef:
          name: my-config
          key: NGINX_PORT

---

apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
 type: LoadBalancer
  selector:
    app: myapp
  ports:
    - name: nginx
      port: 80
      targetPort: 80
    - name: mysql
      port: 3306
      targetPort: 3306

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
data:
 MYSQL_DATABASE: mydb
 MYSQL_USER: appuser
 NGINX_PORT: "80"


