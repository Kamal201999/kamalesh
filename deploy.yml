---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
data:
  MYSQL_DATABASE: mydb
  MYSQL_USER: appuser
  NGINX_PORT: "80"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-mysql
  labels:
    app: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
           - weight: 100
             podAffinityTerm:
              labelSelector:
               matchExpressions:
                - key: app
                  operator: In
                   values:
                    - myapp
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  type: LoadBalancer
  selector:
    app: myapp
  ports:
    - name: nginx
      port: 80
      targetPort: 80
    - name: mysql
      port: 3306
      targetPort: 3306
