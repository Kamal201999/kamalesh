---
apiVersion: v1
kind: ConfigMap
metadata:
 name: my-config
data:
  MYSQL_DATABASE: mydb
  MYSQL_USER: appuser
  NGINX_PORT: "80"
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: web-db-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: mysql
          image: mysql:latest
          ports:
           - containerPort: 3306
          env:
           - name: MYSQL_DATABASE
             valueFrom:
              configMapKeyRef:
               name: my-config
               key: MYSQL_DATABASE
           - name: MYSQL_USER
             valueFrom:
              configMapKeyRef:
               name: my-config
               key: MYSQL_USER
           - name: MYSQL_ROOT_PASSWORD
             valueFrom:
              secretKeyRef:
               name: db-secret
               key: MYSQL_ROOT_PASSWORD    
        - name: nginx
          image: nginx:latest
          env:
           - name: NGINX_PORT
             valueFrom:
              configMapKeyRef:
               name: my-config
               key: NGINX_PORT
          ports:
           - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  type: LoadBalancer
  selector:
    app: myapp
  ports:
    - name: nginx
      port: 80
      targetPort: 80
    - name: mysql
      port: 3306
      targetPort: 3306

