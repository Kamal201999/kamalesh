# -------------------------
# ConfigMap - Application Config
# -------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
data:
  MYSQL_DATABASE: mydb
  MYSQL_USER: appuser
  NGINX_PORT: "80"
---
# -------------------------
# MySQL - Deployment
# -------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: # soft rule due to single-node sandbox
            - weight: 1
              preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - node01
        # requiredDuringSchedulingIgnoredDuringExecution:   -- hard
        #    nodeSelectorTerms:
        #     - matchExpressions:
        #         - key: kubernetes.io/hostname
        #           operator: In
        #           values:
        #             - node01
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: # soft rule due to single-node sandbox
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mysql
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mysql
          image: mysql:latest
          args:
           - --bind-address=0.0.0.0
           - --default-authentication-plugin=mysql_native_password
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: MYSQL_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_ROOT_PASSWORD
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
            requests:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
# -------------------------
# MySQL service
# -------------------------
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
# -------------------------
# Nginx deployment
# -------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx
  labels:
    app: my-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-nginx
  template:
    metadata:
      labels:
        app: my-nginx
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: # soft rule due to single-node sandbox
            - weight: 1
              preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - node01
        # requiredDuringSchedulingIgnoredDuringExecution:   -- hard
        #    nodeSelectorTerms:
        #     - matchExpressions:
        #         - key: kubernetes.io/hostname
        #           operator: In
        #           values:
        #             - node01
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: # soft rule due to single-node sandbox
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - my-nginx
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: nginx
          image: nginx:latest
          env:
            - name: NGINX_PORT
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: NGINX_PORT
            - name: MYSQL_HOST
              value: "mysql-service"
            - name: MYSQL_PORT
              value: "3306"
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
# -------------------------
# Nginx service LoadBalancer
# -------------------------
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  type: LoadBalancer
  selector:
    app: my-nginx
  ports:
    - name: nginx
      port: 80
      targetPort: 80
    - name: my-nginx
      port: 3306
      targetPort: 3306
---
