---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
data:
  MYSQL_DATABASE: mydb
  MYSQL_USER: appuser
  NGINX_PORT: "80"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-mysql
  labels:
    app: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
           - weight: 100
             podAffinityTerm:
              labelSelector:
               matchExpressions:
                - key: app
                  operator: In
                  values:
                   - myapp
              topologyKey: kubernetes.io/hostname
          containers:
        - name: mysql
          image: mysql:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: MYSQL_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_ROOT_PASSWORD
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
            requests:
              memory: "512Mi"
              cpu: "250m"

        - name: nginx
          image: nginx:latest
          env:
            - name: NGINX_PORT
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: NGINX_PORT
          ports:
            - containerPort: 80     
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  type: LoadBalancer
  selector:
    app: myapp
  ports:
    - name: nginx
      port: 80
      targetPort: 80
    - name: mysql
      port: 3306
      targetPort: 3306
